<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{--cream:#faf5e9;--ink:#495957;--bar-height:18dvh;--bar-lift:0px;--button-size:clamp(76px,12dvh,140px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--cream)}body{touch-action:manipulation;user-select:none;-webkit-user-select:none}
#app{height:100dvh;display:flex;flex-direction:column}#stage{flex:1;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center}#scene{height:100%;width:100%;max-width:1800px;overflow:hidden}
.controls{height:calc(var(--bar-height) + var(--bar-lift));flex-shrink:0;position:relative;z-index:10;background:var(--cream);padding-bottom:env(safe-area-inset-bottom)}
.control{position:absolute;bottom:calc(var(--bar-lift) + max(12px, (var(--bar-height) - var(--button-size))/2));width:var(--button-size);height:var(--button-size);border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;background:#eee6d7;color:var(--ink);touch-action:manipulation;transition:background .2s,box-shadow .2s;box-shadow:0 5px 0 #dfd5c4}
.control svg{width:48%;height:48%;pointer-events:none;fill:none;stroke:currentColor;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}.control:focus-visible,#crate:focus-visible{outline:5px solid #527f77;outline-offset:7px}.control:active:not(:disabled){box-shadow:0 1px 0 #c6cfb9;background:#d9e1cd}.control:disabled{opacity:.28;cursor:default}.control[aria-disabled="true"]{cursor:default}
#advance{left:50%;transform:translateX(-50%);background:#718e78;color:#fffdf5;box-shadow:0 6px 0 #526d5b}#advance:active{background:#627e69}#back{left:6vw;scale:.78}#fullscreen{right:6vw;scale:.68;background:transparent;box-shadow:none;color:#8a9387}
#mute{right:calc(6vw + var(--button-size) + 8px);scale:.68;background:transparent;box-shadow:none;color:#8a9387}
#crate{cursor:pointer;outline:none}#crate[aria-disabled="true"]{cursor:default}.crate-motion{transform:translate(0px,-55px) scale(1.15);transform-origin:600px 540px;transition:transform 1.05s cubic-bezier(.22,.8,.3,1)}
.lid-left{transform-origin:434px 365px;transition:transform .8s ease}.lid-right{transform-origin:766px 365px;transition:transform .8s ease}.seal{transition:opacity .25s}
.elephant{transform:translate(685px,591px) scale(.12);opacity:0;transition:transform 1.15s cubic-bezier(.22,.8,.28,1),opacity .55s ease;transform-box:view-box}.animal-shadow{opacity:0;transform:translate(685px,600px) scale(.72);transition:transform 1.15s ease,opacity .8s ease}.ear,.trunk{transform-box:fill-box;transform-origin:50% 20%}
[data-state="revealed"] .crate-motion,[data-state="large"] .crate-motion{transform:translate(-235px,25px) scale(.7)}
[data-state="revealed"] .lid-left,[data-state="large"] .lid-left{transform:rotate(-27deg)}[data-state="revealed"] .lid-right,[data-state="large"] .lid-right{transform:rotate(27deg)}
[data-state="revealed"] .seal,[data-state="large"] .seal{opacity:0}
[data-state="revealed"] .elephant{opacity:1;transform:translate(685px,591px) scale(.72)}[data-state="large"] .elephant{opacity:1;transform:translate(672px,610px) scale(1.32)}
[data-state="revealed"] .animal-shadow{opacity:1}[data-state="large"] .animal-shadow{opacity:1;transform:translate(672px,618px) scale(1.32)}
.growing .ear{animation:ear-settle 1.2s ease both}.growing .trunk{animation:trunk-settle 1.2s ease both}
@keyframes ear-settle{0%,100%{rotate:0deg}45%{rotate:-6deg}75%{rotate:3deg}}@keyframes trunk-settle{0%,100%{rotate:0deg}50%{rotate:-5deg}80%{rotate:2deg}}

/* Return phases retain the original illustration and bottom controls. */
[data-state="returning"] .crate-motion,[data-state="closing"] .crate-motion{transform:translate(-235px,25px) scale(.7)}
[data-state="returning"] .lid-left{transform:rotate(-27deg)}[data-state="returning"] .lid-right{transform:rotate(27deg)}
[data-state="returning"] .seal{opacity:0}
[data-state="returning"] .elephant{transform:translate(388px,518px) scale(.12);opacity:0;transition:transform 1s cubic-bezier(.3,.1,.4,1),opacity .4s .6s ease}
[data-state="closing"] .elephant,[data-state="departing"] .elephant,[data-state="arriving"] .elephant,[data-state="next-wait"] .elephant{transform:translate(388px,518px) scale(.12);opacity:0}
[data-state="departing"] .crate-motion{transform:translate(-1050px,25px) scale(.7);transition:transform .95s ease-in}
[data-state="arriving"] .crate-motion,[data-state="next-wait"] .crate-motion{transform:translate(0px,-55px) scale(1.15);transition:none}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media(max-height:480px){:root{--button-size:68px}.control{bottom:calc(var(--bar-lift) + 8px)}}

/* Shared animal positions extend the accepted elephant scene without changing it. */
[data-creature][hidden]{display:none!important}
.animal{transform:translate(700px,591px) scale(.12);opacity:0;transition:transform 1.15s cubic-bezier(.22,.8,.28,1),opacity .55s ease;transform-box:view-box}
[data-state="revealed"] .animal,[data-state="feature"] .animal{transform:translate(720px,591px) scale(.95);opacity:1}
[data-state="feature"] .crate-motion{transform:translate(-235px,25px) scale(.7)}
[data-state="feature"] .lid-left{transform:rotate(-27deg)}[data-state="feature"] .lid-right{transform:rotate(27deg)}
[data-state="feature"] .seal{opacity:0}[data-state="feature"] .animal-shadow{opacity:1}
[data-state="returning"] .animal{transform:translate(388px,518px) scale(.12);opacity:0;transition:transform 1s cubic-bezier(.3,.1,.4,1),opacity .4s .6s ease}
[data-state="closing"] .animal,[data-state="departing"] .animal,[data-state="arriving"] .animal{transform:translate(388px,518px) scale(.12);opacity:0}
.cage-container,.basket-container{display:none}[data-container="cage"] .wood-container,[data-container="basket"] .wood-container{display:none}[data-container="cage"] .cage-container,[data-container="basket"] .basket-container{display:block}
.cage-door{transform-origin:451px 475px;transition:transform .8s ease}
[data-container="cage"]:is([data-state="revealed"],[data-state="feature"],[data-state="returning"]) .cage-door{transform:translateX(-48px) scaleX(.22)}
.giraffe-neck{transform-origin:-95px -171px;transition:transform 1.25s cubic-bezier(.22,.8,.3,1)}
.giraffe-head{transition:transform 1.25s cubic-bezier(.22,.8,.3,1)}
[data-state="feature"] .giraffe-neck{transform:scaleY(1.88)}[data-state="feature"] .giraffe-head{transform:translateY(-155px)}
.lion-calm,.lion-fierce,.camel-calm,.camel-grumpy{transition:opacity .28s ease}
.lion-fierce,.camel-grumpy{opacity:0}[data-state="feature"] .lion-calm,[data-state="feature"] .camel-calm{opacity:0}
[data-state="feature"] .lion-fierce,[data-state="feature"] .camel-grumpy{opacity:1}
.camel-head{transform-origin:-139px -286px;transition:transform .65s ease}[data-state="feature"] .camel-head{transform:rotate(-14deg)}
.snake-tongue,.monkey-tongue,.puppy-tongue{opacity:0;transition:opacity .2s ease}[data-state="feature"] .snake-tongue,[data-state="feature"] .monkey-tongue,[data-state="perfect"] .puppy-tongue,[data-state="ended"] .puppy-tongue{opacity:1}
[data-state="feature"] .snake-pose{transform:translate(-24px,-18px)}.performing .snake-pose{animation:snake-peek 1s ease-out both}
@keyframes snake-peek{0%{transform:translate(0,0)}28%{transform:translate(-48px,-40px)}65%,100%{transform:translate(-24px,-18px)}}
.monkey-arm{transform-origin:-48px -203px;transition:transform .3s}.monkey-eye{transition:ry .2s}
[data-state="feature"] .monkey-arm{transform:rotate(18deg)}[data-state="feature"] .monkey-eye{ry:3px}
.performing .monkey-motion{animation:monkey-play 1.75s ease-in-out both}
@keyframes monkey-play{0%,100%{transform:translate(0,0) rotate(0)}22%{transform:translate(-52px,-65px) rotate(-8deg)}40%{transform:translate(-35px,0)}66%{transform:translate(55px,-72px) rotate(9deg)}84%{transform:translate(34px,0)}}
.performing .frog-motion{animation:frog-hops 1.8s ease-in-out both;transform-origin:0 0}
@keyframes frog-hops{0%,33%,66%,100%{transform:translateY(0) scale(1,1)}6%,39%,72%{transform:translateY(0) scale(1.08,.9)}17%,50%,83%{transform:translateY(-105px) scale(.95,1.04)}28%,61%,94%{transform:translateY(0) scale(1.08,.93)}}
[data-state="revealed"] .animal[data-creature="puppy"]{transform:translate(553px,591px) scale(.68)}
[data-state="perfect"] .animal[data-creature="puppy"],[data-state="ended"] .animal[data-creature="puppy"]{transform:translate(620px,591px) scale(1.03);opacity:1}
[data-animal="puppy"]:is([data-state="perfect"],[data-state="cuddling"],[data-state="ended"]) .crate-motion{transform:translate(-235px,25px) scale(.7)}
[data-animal="puppy"]:is([data-state="perfect"],[data-state="cuddling"],[data-state="ended"]) .lid-left{transform:rotate(-27deg)}[data-animal="puppy"]:is([data-state="perfect"],[data-state="cuddling"],[data-state="ended"]) .lid-right{transform:rotate(27deg)}
[data-animal="puppy"]:is([data-state="perfect"],[data-state="cuddling"],[data-state="ended"]) .seal{opacity:0}
[data-animal="puppy"]:is([data-state="perfect"],[data-state="cuddling"],[data-state="ended"]) .animal-shadow{opacity:1;transform:translate(620px,600px) scale(1)}
.puppy-tail{transform-origin:82px -105px}.revealing .puppy-tail,.performing .puppy-tail{animation:puppy-wag .28s ease-in-out 5 alternate}
@keyframes puppy-wag{from{transform:rotate(-14deg)}to{transform:rotate(17deg)}}
.performing .puppy-motion{animation:puppy-run 1.45s ease-in-out both}
@keyframes puppy-run{0%,100%{transform:translateY(0)}20%,58%{transform:translateY(-22px) rotate(-3deg)}38%,76%{transform:translateY(0) rotate(2deg)}}
.puppy-hearts{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform 1s ease}
:is([data-state="perfect"],[data-state="cuddling"],[data-state="ended"]) .puppy-hearts{opacity:1;transform:translateY(0)}

/* Container-specific lids and return targets; story timing and button layout stay shared. */
.basket-lid{transform-origin:476px 435px;transition:transform .8s ease}
[data-container="basket"]:is([data-state="revealed"],[data-state="feature"],[data-state="perfect"],[data-state="cuddling"],[data-state="ended"],[data-state="returning"]) .basket-lid{transform:rotate(-94deg)}
[data-container="basket"]:is([data-state="returning"],[data-state="closing"],[data-state="departing"]) .animal{transform:translate(371px,551px) scale(.09)}
[data-container="cage"]:is([data-state="returning"],[data-state="closing"],[data-state="departing"]) .animal{transform:translate(365px,542px) scale(.1)}
/* The third puppy click introduces the child and lifts the existing puppy. */
.boy{opacity:0;visibility:hidden;transform:translate(-22px,10px);transition:opacity .4s ease,transform .55s ease,visibility .4s}
[data-animal="puppy"]:is([data-state="cuddling"],[data-state="ended"]) .boy{opacity:1;visibility:visible;transform:translate(0,0)}
[data-animal="puppy"]:is([data-state="cuddling"],[data-state="ended"]) .animal[data-creature="puppy"]{transform:translate(680px,431px) scale(.56);opacity:1;transition:transform 1.3s .25s cubic-bezier(.25,.6,.25,1),opacity .3s}
[data-state="cuddling"] .puppy-tongue{opacity:1}
[data-animal="puppy"]:is([data-state="cuddling"],[data-state="ended"]) .puppy-hearts{opacity:0;transition:opacity .3s}
[data-animal="puppy"]:is([data-state="cuddling"],[data-state="ended"]) .animal-shadow{opacity:0}
[data-animal="puppy"][data-state="cuddling"] .crate-motion{transform:translate(-235px,25px) scale(.7)}
.hug-arm{transform-origin:526px 314px;transform:rotate(20deg);transition:transform 1.3s .25s ease}
:is([data-state="cuddling"],[data-state="ended"]) .hug-arm{transform:rotate(0)}
.embracing .puppy-tail{animation:puppy-wag .28s ease-in-out 5 alternate}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;transition-delay:0s!important;animation-iteration-count:1!important}}

</style>
